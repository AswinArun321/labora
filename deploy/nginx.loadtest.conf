# Nginx High-Concurrency Load Testing Configuration for LABORA
# Tailored for external load generators where all virtual students originate from one client IP.
# Relaxes IP-level rate limits on /api/auth/login/ to prevent false 503 throttling during benchmarks.

# Map Authorization header to rate-limit by authenticated student, falling back to IP
map $http_authorization $client_id {
    ""      $binary_remote_addr;
    default $http_authorization;
}

# High-concurrency rate limit zones for load testing
# Login zone allows up to 2000 req/min with a 300 burst from the benchmark runner
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2000r/m;
limit_req_zone $client_id zone=run_limit:20m rate=1000r/m;
limit_req_zone $client_id zone=general_limit:20m rate=5000r/m;

upstream django_backend {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Gzip Compression for fast Monaco editor and SPA loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets of React SPA
    location /assets/ {
        root /var/www/labora;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check probe (unthrottled)
    location = /api/health/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authentication Endpoint (High-concurrency benchmark zone)
    location /api/auth/login/ {
        limit_req zone=login_limit burst=300 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Code Execution Rate Limiting
    location ~* ^/api/workspace/[0-9]+/run.* {
        limit_req zone=run_limit burst=100 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # General API Endpoints
    location /api/ {
        limit_req zone=general_limit burst=500 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA Fallback: Serve index.html for React Router
    location / {
        root /var/www/labora;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
