<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>LABORA - cannot reach server</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; display: grid; place-items: center; height: 100vh; margin: 0; color: #1e293b; }
  .card { background: #fff; padding: 32px; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); max-width: 440px; text-align: center; }
  h1 { font-size: 20px; margin: 8px 0; }
  p { color: #64748b; font-size: 14px; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  button { background: #2852e0; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; margin: 4px; }
  button.secondary { background: #e2e8f0; color: #334155; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:36px">🔌</div>
    <h1>Cannot reach the LABORA server</h1>
    <p>Server: <code id="url"></code></p>
    <p id="err"></p>
    <p>Check the lab network or ask the lab administrator.</p>
    <button onclick="window.laboraSecure.retry()">Try again</button>
    <button class="secondary" onclick="window.laboraSecure.quit()">Exit</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search)
    document.getElementById('url').textContent = q.get('url') || ''
    document.getElementById('err').textContent = q.get('error') || ''
  </script>
</body>
</html>
