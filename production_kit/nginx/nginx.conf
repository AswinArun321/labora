# Nginx Production Configuration for LABORA
# High-concurrency optimized for up to 1,000 active students

# Rate limiting zones to protect authentication and execution
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=run_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;

upstream django_backend {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates (Let's Encrypt or College CA)
    ssl_certificate /etc/letsencrypt/live/labora/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labora/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression for fast Monaco editor and SPA loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 25M;

    # Static assets of React SPA
    location /assets/ {
        root /var/www/labora;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Authentication Rate Limiting
    location /api/auth/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://django_backend;
        include proxy_params;
    }

    # Code Execution Rate Limiting
    location ~* ^/api/workspace/[0-9]+/run.* {
        limit_req zone=run_limit burst=10 nodelay;
        proxy_pass http://django_backend;
        include proxy_params;
    }

    # General API Endpoints
    location /api/ {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA Fallback: Serve index.html for React Router
    location / {
        root /var/www/labora;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
