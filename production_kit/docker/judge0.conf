# Judge0 CE Configuration for LABORA Production Lab
# Enforces strong CPU, memory, and timeout limits on untrusted student code

# Server settings
PORT=2358
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false

# Resource limits for student programs
CPU_TIME_LIMIT=5.0
CPU_EXTRA_TIME=1.0
WALL_TIME_LIMIT=10.0
MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=2048
NUMBER_OF_RUNS=1

# Output limits to prevent log saturation
MAX_EXTRACT_SIZE=10240
OUTPUT_LIMIT=64000

# Sandbox isolation (requires Linux cgroups v1 or v2)
USE_SUBMISSION_CACHE=false
ENABLE_WAIT_RESULT=false
