# LABORA Complete Production Docker Compose Deployment
# Implements ₹0 software cost target using self-hosted open-source software on college hardware
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Authoritative Relational Database (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: labora-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labora}
      POSTGRES_USER: ${POSTGRES_USER:-labora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/db:/backups
    networks:
      - labora-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labora_admin} -d ${POSTGRES_DB:-labora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis Task Queue Broker & Application Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: labora-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecurePass456}
    volumes:
      - redis_data:/data
    networks:
      - labora-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. LABORA Django REST API Backend (Gunicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../../server/backend
      dockerfile: ../../production_kit/docker/Dockerfile.backend
    container_name: labora-backend
    restart: always
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-key-replace-with-random-entropy}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN_NAME:-localhost},127.0.0.1,labora-backend
      - POSTGRES_DB=${POSTGRES_DB:-labora}
      - POSTGRES_USER=${POSTGRES_USER:-labora_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/2
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/1
      - CODE_EXECUTOR=judge0
      - JUDGE0_URL=http://judge0-server:2358
      - DOCX_PDF_CONVERTER=auto
      - LABORA_SECURE_BROWSER_KEY=${LABORA_SECURE_BROWSER_KEY:-change-this-shared-browser-key}
      - TIME_ZONE=Asia/Kolkata
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - labora-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 4. Celery Asynchronous Execution Dispatcher
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ../../server/backend
      dockerfile: ../../production_kit/docker/Dockerfile.backend
    container_name: labora-celery-worker
    restart: always
    command: celery -A labora worker -l info --concurrency=8
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-key-replace-with-random-entropy}
      - POSTGRES_DB=${POSTGRES_DB:-labora}
      - POSTGRES_USER=${POSTGRES_USER:-labora_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/2
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/1
      - CODE_EXECUTOR=judge0
      - JUDGE0_URL=http://judge0-server:2358
      - TIME_ZONE=Asia/Kolkata
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - labora-internal

  # ---------------------------------------------------------------------------
  # 4b. Celery Periodic Scheduler (Beat - Stale Execution Reconciler)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ../../server/backend
      dockerfile: ../../production_kit/docker/Dockerfile.backend
    container_name: labora-celery-beat
    restart: always
    command: celery -A labora beat -l info
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-key-replace-with-random-entropy}
      - POSTGRES_DB=${POSTGRES_DB:-labora}
      - POSTGRES_USER=${POSTGRES_USER:-labora_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeSecurePassword123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/2
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass456}@redis:6379/1
      - TIME_ZONE=Asia/Kolkata
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - labora-internal

  # ---------------------------------------------------------------------------
  # 5. Judge0 Isolated Sandbox Execution Engine
  # ---------------------------------------------------------------------------
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: labora-judge0-server
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=Judge0DbPassSecret789
      - POSTGRES_DB=judge0
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - labora-internal
      - judge0-net

  judge0-db:
    image: postgres:13-alpine
    container_name: labora-judge0-db
    restart: always
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=Judge0DbPassSecret789
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - judge0-net

  judge0-redis:
    image: redis:7-alpine
    container_name: labora-judge0-redis
    restart: always
    networks:
      - judge0-net

  # ---------------------------------------------------------------------------
  # 6. Edge Nginx Reverse Proxy & Static Asset Caching
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: labora-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../server/frontend/dist:/var/www/labora:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - labora-internal

volumes:
  postgres_data:
  redis_data:
  judge0_db_data:
  media_data:
  static_data:

networks:
  labora-internal:
    driver: bridge
  judge0-net:
    driver: bridge
    internal: true
